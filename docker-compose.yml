version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vibetrack
      POSTGRES_USER: vibetrack
      POSTGRES_PASSWORD: vibetrack
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://vibetrack:vibetrack@db:5432/vibetrack
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A vibetrack_site worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://vibetrack:vibetrack@db:5432/vibetrack
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  db_data:
