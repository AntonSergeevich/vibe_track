services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vibetrack
      POSTGRES_USER: vibetrack
      POSTGRES_PASSWORD: vibetrack
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://vibetrack:vibetrack@db:5432/vibetrack
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MEDIA_ROOT: /app/media
    depends_on: [db, redis]

  worker:
    build: .
    # рендер упирается в CPU: по одной задаче на процесс, воркер перезапускается
    command: celery -A vibetrack_site worker --loglevel=info --concurrency=2 --max-tasks-per-child=8
    volumes:
      - .:/app
      - media:/app/media
      - models:/models          # веса Demucs и Whisper переживают перезапуск контейнера
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://vibetrack:vibetrack@db:5432/vibetrack
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MEDIA_ROOT: /app/media
      VIBETRACK_MODEL_CACHE: /models
      VIBETRACK_PRELOAD_MODELS: "1"
      VIBETRACK_TORCH_THREADS: "2"
    depends_on: [db, redis]

volumes:
  db_data:
  media:
  models:
